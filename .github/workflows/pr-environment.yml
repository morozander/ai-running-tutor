name: pr-environment

# Per-PR ephemeral environment. Reuses existing dev infrastructure
# (VPC, RDS, API Gateway, CloudFront, ECR); creates an isolated Lambda,
# PostgreSQL schema and S3 frontend subfolder. Cleaned up on PR close/merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_ID: ${{ github.event.pull_request.number }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  G_APPLICATION_ID: ${{ secrets.G_APPLICATION_ID }}
  G_AWS_PROFILE: ${{ secrets.G_AWS_PROFILE }}
  G_AWS_PROFILE_SHARED: ${{ secrets.G_AWS_PROFILE_SHARED }}
  G_AWS_REGION_DEFAULT: ${{ secrets.G_AWS_REGION_DEFAULT }}
  ENV_AWS_ROLE_ARN: ${{ secrets.ENV_AWS_ROLE_ARN }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  # ---- Stage: infra — fetch dev outputs into build.env ----
  generate-dotenv:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: alpine/terragrunt:tf1.14.5
    steps:
      - uses: actions/checkout@v4
      - name: Generate dotenv
        run: |
          NAME=dev .github/scripts/iaac_pre_apply.sh
          .github/scripts/pr-generate-dotenv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build.env
          retention-days: 1

  # ---- Stage: build-backend (Docker buildx -> ECR, on host runner) ----
  build-backend:
    if: ${{ github.event.action != 'closed' }}
    needs: generate-dotenv
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Load env
        run: cat build.env >> "$GITHUB_ENV"
      - name: ECR login
        run: |
          AWS_ECR_REPO_URI="${AWS_ECR_REPO_URL%%/*}"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ECR_REPO_URI"
      - name: Build & push PR image
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          # --provenance=false --sbom=false: Lambda rejects buildx's default OCI
          # manifest index with attestations; produce a plain Docker v2 image.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t "$AWS_ECR_REPO_URL:$IMAGE_TAG" \
            --push \
            ./backend

  # ---- Stage: deploy-backend — create DB schema + run migrations ----
  create-schema:
    if: ${{ github.event.action != 'closed' }}
    needs: [build-backend, generate-dotenv]
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: alpine/terragrunt:tf1.14.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Create schema
        run: |
          cat build.env >> "$GITHUB_ENV"
          NAME=dev .github/scripts/iaac_pre_apply.sh
          export IMAGE_TAG="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          PR_ID=$PR_ID IMAGE_TAG=$IMAGE_TAG ACTION=create-schema .github/scripts/pr-environment.sh

  # ---- Stage: deploy-backend — create/update Lambda + API Gateway route ----
  deploy-backend:
    if: ${{ github.event.action != 'closed' }}
    needs: [build-backend, create-schema, generate-dotenv]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Deploy PR Lambda + route
        run: |
          cat build.env >> "$GITHUB_ENV"
          export $(grep -v '^#' build.env | xargs)
          .github/scripts/aws-assume-env-role.sh
          export IMAGE_TAG="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          PR_ID=$PR_ID ACTION=deploy-lambda .github/scripts/pr-environment.sh
          PR_ID=$PR_ID ACTION=add-apigw-route .github/scripts/pr-environment.sh

  # ---- Stage: build-frontend — build with PR-specific env vars ----
  build-frontend:
    if: ${{ github.event.action != 'closed' }}
    needs: [deploy-backend, generate-dotenv]
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Build frontend
        working-directory: frontend
        run: |
          set -a; . ../build.env; set +a
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm config set store-dir "${GITHUB_WORKSPACE}/.pnpm-store"
          export VITE_BASE_PATH="/pr-${PR_ID}/"
          export VITE_APP_API_URL="${AWS_BE_APIGW_ENDPOINT}/pr-${PR_ID}/api/v1"
          export VITE_APP_BASE_URL="https://${AWS_FE_CLOUDFRONT_DOMAIN_NAME}/pr-${PR_ID}"
          env | grep '^VITE_' | sort > .env
          pnpm install --frozen-lockfile --ignore-scripts
          # Retry codegen to ride out the freshly-deployed Lambda's cold-start 503.
          codegen_ok=false
          for i in 1 2 3 4 5 6; do
            if pnpm run codegen; then codegen_ok=true; break; fi
            echo "codegen attempt $i failed (API warming up?), retrying in 15s..."
            sleep 15
          done
          [ "$codegen_ok" = true ] || { echo "codegen failed after retries"; exit 1; }
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ---- Stage: deploy-frontend — sync to S3 subfolder + invalidate ----
  deploy-frontend:
    if: ${{ github.event.action != 'closed' }}
    needs: [build-frontend, generate-dotenv]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy PR frontend
        run: |
          export $(grep -v '^#' build.env | xargs)
          .github/scripts/aws-assume-env-role.sh
          PR_ID=$PR_ID ACTION=deploy-frontend .github/scripts/pr-environment.sh

  # ---- Stage: pr-comment — post preview URL ----
  comment:
    if: ${{ github.event.action != 'closed' }}
    needs: [deploy-frontend, generate-dotenv]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('fs');
            const env = {};
            for (const line of fs.readFileSync('build.env', 'utf8').split('\n')) {
              const m = line.match(/^([A-Z0-9_]+)=(.*)$/);
              if (m) env[m[1]] = m[2];
            }
            const prId = process.env.PR_ID;
            const frontendUrl = `https://${env.AWS_FE_CLOUDFRONT_DOMAIN_NAME}/pr-${prId}/`;
            const backendUrl = `${env.AWS_BE_APIGW_ENDPOINT}/pr-${prId}/api/v1`;
            const body = [
              '## PR Environment Deployed', '',
              '| Resource | URL |', '|----------|-----|',
              `| Frontend | ${frontendUrl} |`,
              `| Backend API | ${backendUrl} |`,
              `| DB Schema | \`pr_${prId}\` |`, '',
              '_This environment will be automatically cleaned up when the PR is closed or merged._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prId),
              body,
            });
            const slack = process.env.SLACK_WEBHOOK_URL;
            if (slack) {
              const payload = {
                text: 'PR Environment Deployed',
                blocks: [
                  { type: 'header', text: { type: 'plain_text', text: 'PR Environment Deployed', emoji: true } },
                  { type: 'section', fields: [
                    { type: 'mrkdwn', text: `*Frontend:*\n${frontendUrl}` },
                    { type: 'mrkdwn', text: `*Backend API:*\n${backendUrl}` },
                  ] },
                  { type: 'section', fields: [
                    { type: 'mrkdwn', text: `*DB Schema:*\n\`pr_${prId}\`` },
                    { type: 'mrkdwn', text: `*PR:*\n<${context.payload.pull_request.html_url}|#${prId}>` },
                  ] },
                  { type: 'context', elements: [{ type: 'mrkdwn', text: '_Auto-cleanup on PR close/merge._' }] },
                ],
              };
              await fetch(slack, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
            }

  # ---- Stage: cleanup — destroy PR resources on close/merge ----
  cleanup:
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup PR environment
        run: |
          .github/scripts/aws-assume-env-role.sh
          AWS_CI_SECRET_ID="/${G_APPLICATION_ID}/dev/cicd/envs"
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_CI_SECRET_ID" \
            --profile "$G_AWS_PROFILE" \
            --query 'SecretString' \
            --output text)
          export AWS_ECR_REPO_URL=$(echo "$SECRET_JSON" | jq -r '.AWS_ECR_REPO_URL')
          export AWS_FE_BUCKET_NAME=$(echo "$SECRET_JSON" | jq -r '.AWS_FE_BUCKET_NAME // empty')
          export AWS_FE_CLOUDFRONT_DISTRIBUTION_ID=$(echo "$SECRET_JSON" | jq -r '.AWS_FE_CLOUDFRONT_DISTRIBUTION_ID // empty')
          export AWS_FE_CLOUDFRONT_DOMAIN_NAME=$(echo "$SECRET_JSON" | jq -r '.AWS_FE_CLOUDFRONT_DOMAIN_NAME // empty')
          export AWS_BE_LAMBDA_MAIN_NAME=$(echo "$SECRET_JSON" | jq -r '.AWS_BE_LAMBDA_MAIN_NAME')
          export AWS_BE_LAMBDA_MIGRATIONS_NAME=$(echo "$SECRET_JSON" | jq -r '.AWS_BE_LAMBDA_MIGRATIONS_NAME')
          export AWS_BE_APIGW_ENDPOINT=$(echo "$SECRET_JSON" | jq -r '.AWS_BE_APIGW_ENDPOINT')
          export AWS_COGNITO_USER_POOL_ID=$(echo "$SECRET_JSON" | jq -r '.AWS_COGNITO_USER_POOL_ID // empty')
          export AWS_COGNITO_CLIENT_ID=$(echo "$SECRET_JSON" | jq -r '.AWS_COGNITO_CLIENT_ID // empty')
          PR_ID=$PR_ID ACTION=cleanup .github/scripts/pr-environment.sh
