name: _deploy

# Reusable deployment pipeline (infra -> dotenv -> backend -> frontend).
# Called by deploy-dev / deploy-staging / deploy-production.
# The "build.env" artifact carries Terragrunt outputs between jobs
# (replaces GitLab's dotenv report auto-injection).
on:
  workflow_call:
    inputs:
      environment:
        description: dev | staging | production
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  G_APPLICATION_ID: ${{ secrets.G_APPLICATION_ID }}
  G_AWS_PROFILE: ${{ secrets.G_AWS_PROFILE }}
  G_AWS_PROFILE_SHARED: ${{ secrets.G_AWS_PROFILE_SHARED }}
  G_AWS_REGION_DEFAULT: ${{ secrets.G_AWS_REGION_DEFAULT }}
  ENV_AWS_ROLE_ARN: ${{ secrets.ENV_AWS_ROLE_ARN }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  # ---- Stage: infra (always runs; Terragrunt apply is idempotent) ----
  # Runs on every deploy so a fresh environment bootstraps hands-off. After the
  # first full apply, iaac_apply.sh only re-applies the fast INCLUDE_MODULES
  # (secrets-manager, cognito), so repeat runs stay cheap.
  infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    container:
      image: alpine/terragrunt:tf1.14.5
    steps:
      - uses: actions/checkout@v4
      - name: Terragrunt apply
        run: |
          NAME=${{ inputs.environment }} .github/scripts/iaac_pre_apply.sh
          NAME=${{ inputs.environment }} .github/scripts/iaac_apply.sh

  # ---- Stage: dotenv (reads Terragrunt outputs into build.env) ----
  dotenv:
    runs-on: ubuntu-latest
    needs: infra
    environment: ${{ inputs.environment }}
    container:
      image: alpine/terragrunt:tf1.14.5
    steps:
      - uses: actions/checkout@v4
      - name: Generate dotenv
        run: |
          NAME=${{ inputs.environment }} .github/scripts/iaac_pre_apply.sh
          NAME=${{ inputs.environment }} .github/scripts/iaac_post_apply.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build.env
          retention-days: 1

  # ---- Stage: build-backend (Docker buildx -> ECR) ----
  # Runs on the host runner (docker + buildx + aws pre-installed). Avoids the
  # moby/buildkit:rootless job-container, whose uid-1000 user cannot access the
  # runner's file commands (actions/checkout fails with EACCES).
  build-backend:
    runs-on: ubuntu-latest
    needs: dotenv
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Load env
        run: cat build.env >> "$GITHUB_ENV"
      - name: ECR login
        run: |
          AWS_ECR_REPO_URI="${AWS_ECR_REPO_URL%%/*}"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ECR_REPO_URI"
      - name: Build & push image
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          # --provenance=false --sbom=false: AWS Lambda rejects the OCI manifest
          # index with attestations that buildx pushes by default. These flags
          # produce a plain Docker v2 image Lambda accepts.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t "$AWS_ECR_REPO_URL:$IMAGE_TAG" \
            --push \
            ./backend

  # ---- Stage: deploy-backend (Lambda update) ----
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-backend, dotenv]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Load env
        run: cat build.env >> "$GITHUB_ENV"
      - name: Deploy backend
        run: |
          .github/scripts/aws-assume-env-role.sh
          export IMAGE_TAG="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          aws lambda update-function-code --function-name "$AWS_BE_LAMBDA_MAIN_NAME" --image-uri "$AWS_ECR_REPO_URL:$IMAGE_TAG" --profile "$G_AWS_PROFILE"
          aws lambda update-function-code --function-name "$AWS_BE_LAMBDA_MIGRATIONS_NAME" --image-uri "$AWS_ECR_REPO_URL:$IMAGE_TAG" --profile "$G_AWS_PROFILE"

  # ---- Stage: build-frontend ----
  build-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend, dotenv]
    environment: ${{ inputs.environment }}
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Load env
        run: cat build.env >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm config set store-dir "${GITHUB_WORKSPACE}/.pnpm-store"
          env | grep '^VITE_' | sort > .env
          pnpm install --frozen-lockfile --ignore-scripts
          # codegen loads the schema from the live API; retry to ride out a
          # freshly-deployed Lambda's cold-start 503 (Service Unavailable).
          codegen_ok=false
          for i in 1 2 3 4 5 6; do
            if pnpm run codegen; then codegen_ok=true; break; fi
            echo "codegen attempt $i failed (API warming up?), retrying in 15s..."
            sleep 15
          done
          [ "$codegen_ok" = true ] || { echo "codegen failed after retries"; exit 1; }
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ---- Stage: deploy-frontend (S3 + CloudFront) ----
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend, dotenv]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-env
      - name: Load env
        run: cat build.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy frontend
        run: |
          .github/scripts/aws-assume-env-role.sh
          aws s3 sync frontend/dist "s3://$AWS_FE_BUCKET_NAME" --delete --profile "$G_AWS_PROFILE"
          aws cloudfront create-invalidation --distribution-id "$AWS_FE_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" --profile "$G_AWS_PROFILE"
