sonar.projectKey=monorepo
sonar.qualitygate.wait=true

# Sonar's embedded TypeScript (e.g. 5.3.x) cannot load Vite tsconfigs that use newer-only
# options (erasableSyntaxOnly, noUncheckedSideEffectImports). Use a compatible config for analysis only.
sonar.typescript.tsconfigPaths=frontend/tsconfig.sonar.json,backend/tsconfig.json

sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.pnpm-store/**,**/pnpm-lock.yaml,**/package-lock.json

sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
